# ════════════════════════════════════════════════════════════════
# VOD System — Docker Compose
# Môi trường: Local Development
# Lệnh khởi động: docker-compose up --build
# Lệnh dừng:      docker-compose down
# Lệnh dừng + xóa volumes: docker-compose down -v
# ════════════════════════════════════════════════════════════════

name: vod-system

# ─── SHARED ENV DEFAULTS ────────────────────────────────────────
x-common-env: &common-env
  NODE_ENV: development
  TZ: Asia/Ho_Chi_Minh

# ─── SHARED HEALTHCHECK BASE ────────────────────────────────────
x-healthcheck-base: &healthcheck-base
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 20s

services:

  # ════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: vod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vod_users
      POSTGRES_USER:     vod_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vod_local_password}
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD-SHELL", "pg_isready -U vod_admin -d vod_users"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit heartbeat 60"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      start_period: 30s

  # ════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ════════════════════════════════════════════════════════════════

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: vod-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      PORT:                    3000
      JWT_SECRET:              ${JWT_SECRET:-dev-secret-change-in-production}
      USER_SERVICE_URL:         http://user-service:3001
      UPLOAD_SERVICE_URL:       http://upload-service:3002
      VIDEO_SERVICE_URL:        http://video-service:3003
      PROCESSING_SERVICE_URL:   http://processing-service:3004
      STREAMING_SERVICE_URL:    http://streaming-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      CORS_ORIGINS:             ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      user-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      streaming-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]

  # User service code nằm tại user-service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: vod-user-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      <<: *common-env
      PORT:         3001
      DATABASE_URL: postgresql://vod_admin:${POSTGRES_PASSWORD:-vod_local_password}@postgres:5432/vod_users
      JWT_SECRET:   ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]

  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: vod-upload-service
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      <<: *common-env
      PORT:                3002
      RABBITMQ_URL:        amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
      GCP_PROJECT_ID:      ${GCP_PROJECT_ID:-local-dev}
      GCS_BUCKET_NAME:     ${GCS_BUCKET_NAME:-vod-videos-local}
      GCS_RAW_VIDEO_FOLDER: raw-videos
      MAX_FILE_SIZE_MB:    500
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    container_name: vod-video-service
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      <<: *common-env
      PORT:            3003
      GCP_PROJECT_ID:  ${GCP_PROJECT_ID:-local-dev}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]

  processing-service:
    build:
      context: ./processing-service
      dockerfile: Dockerfile
    container_name: vod-processing-service
    restart: unless-stopped
    expose:
      - "3004"
    environment:
      <<: *common-env
      PORT:                    3004
      RABBITMQ_URL:            amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
      GCP_PROJECT_ID:          ${GCP_PROJECT_ID:-local-dev}
      GCS_BUCKET_NAME:         ${GCS_BUCKET_NAME:-vod-videos-local}
      GCS_RAW_VIDEO_FOLDER:    raw-videos
      GCS_HLS_OUTPUT_FOLDER:   hls-outputs
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
      - processing-tmp:/tmp/vod-processing
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      start_period: 30s

  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
    container_name: vod-streaming-service
    restart: unless-stopped
    expose:
      - "3005"
    environment:
      <<: *common-env
      PORT:            3005
      GCP_PROJECT_ID:  ${GCP_PROJECT_ID:-local-dev}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-vod-videos-local}
      GCS_HLS_OUTPUT_FOLDER: hls-outputs
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: vod-notification-service
    restart: unless-stopped
    expose:
      - "3006"
    environment:
      <<: *common-env
      PORT:            3006
      RABBITMQ_URL:    amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
      GCP_PROJECT_ID:  ${GCP_PROJECT_ID:-local-dev}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vod-network
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]

networks:
  vod-network:
    driver: bridge
    name: vod-network

volumes:
  postgres-data:
    name: vod-postgres-data
  rabbitmq-data:
    name: vod-rabbitmq-data
  processing-tmp:
    name: vod-processing-tmp
