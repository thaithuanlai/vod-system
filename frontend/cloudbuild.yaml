steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'VITE_API_GATEWAY_URL=$_GATEWAY_URL'
  - '--build-arg'
  - 'VITE_STREAMING_SERVICE_URL=$_STREAMING_URL'
  - '-t'
  - '$_IMAGE_NAME'
  - '.'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$_IMAGE_NAME']
images:
- '$_IMAGE_NAME'
