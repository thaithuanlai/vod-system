version: '3.8'

# Docker Compose cho phần của Nhi (T24, T25, T26, T36, T37)
# Chạy: docker-compose -f docker-compose.nhi.yml up --build

services:

  # ── Video Service (port 3003) ────────────────────────────────
  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    container_name: vod-video-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    volumes:
      # Mount file service account từ host vào container
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Streaming Service (port 3005) ────────────────────────────
  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
    container_name: vod-streaming-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_HLS_PREFIX: ${GCS_HLS_PREFIX:-hls-outputs}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── RabbitMQ (cần cho Notification Service) ──────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vod-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Notification Service (port 3006) ─────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: vod-notification-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_VIDEO_PROCESSED_QUEUE: ${RABBITMQ_VIDEO_PROCESSED_QUEUE:-video-processed}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/service-account.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (port 5173 dev / 8080 prod) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vod-frontend
    ports:
      - "8080:80"
    environment:
      VITE_VIDEO_SERVICE_URL: http://localhost:3003
      VITE_STREAMING_SERVICE_URL: http://localhost:3005
    depends_on:
      - video-service
      - streaming-service
    restart: unless-stopped

volumes:
  rabbitmq_data:
